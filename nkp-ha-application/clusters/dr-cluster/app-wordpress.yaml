---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wordpress-gatewayapi
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./nkp-ha-application/infrastructure/gateway_api/wordpress
  prune: true
  sourceRef:
    kind: GitRepository
    name: technote-repo
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings # Injects wordpress.gslb.thencpnutanix.com

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wordpress-gslb
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./nkp-ha-application/infrastructure/gslb/wordpress
  prune: true
  sourceRef:
    kind: GitRepository
    name: technote-repo


