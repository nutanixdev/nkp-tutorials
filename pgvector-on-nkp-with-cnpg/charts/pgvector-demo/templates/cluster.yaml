apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name }}
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName }}

  storage:
    size: {{ .Values.storageSize }}

  bootstrap:
    initdb:
      database: {{ .Values.database }}
      owner: {{ .Values.owner }}
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS vector;"
        - |
          CREATE TABLE documents (
            id bigserial PRIMARY KEY,
            title text NOT NULL,
            content text NOT NULL,
            embedding vector(3)
          );
        - |
          INSERT INTO documents (title, content, embedding) VALUES
            ('Kubernetes backups', 'Backups protect persistent application data.', '[0.10,0.20,0.30]'),
            ('RAG architecture', 'A RAG system retrieves context before generating answers.', '[0.11,0.19,0.31]'),
            ('PostgreSQL recovery', 'WAL archiving enables point-in-time recovery.', '[0.80,0.10,0.10]'),
            ('Cluster autoscaling', 'Autoscaling changes node capacity based on workload demand.', '[0.20,0.75,0.10]');
        - |
          CREATE INDEX documents_embedding_hnsw_idx
          ON documents
          USING hnsw (embedding vector_cosine_ops);